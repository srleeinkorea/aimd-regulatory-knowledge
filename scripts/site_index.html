<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 의료기기 인허가 문서함</title>
<style>
:root{--bg:#f1f5f9;--side:#0f172a;--side-2:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#0d9488}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg)}
body{display:flex;height:100dvh;overflow:hidden}
nav{flex:0 0 272px;background:var(--side);color:var(--text);display:flex;flex-direction:column;padding:20px 12px 10px;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#0f766e,#0891b2);display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
.brand b{font-size:16px}.brand small{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
.nav-search{display:block;margin:0 4px 14px}
.nav-search input{width:100%;padding:10px 12px;border:1px solid #334155;border-radius:9px;background:var(--side-2);color:#f8fafc;font:inherit;font-size:12px}
.nav-search input::placeholder{color:var(--muted)}
.nav-list{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#475569 transparent;padding:0 2px 12px}
.nav-group{margin-bottom:8px}
.nav-group summary{display:flex;align-items:center;gap:8px;padding:11px 8px;color:#cbd5e1;cursor:pointer;font-size:12px;font-weight:700;list-style:none;border-radius:7px}
.nav-group summary::-webkit-details-marker{display:none}
.nav-group summary::before{content:'›';font-size:18px;line-height:12px;transition:transform .15s}
.nav-group[open] summary::before{transform:rotate(90deg)}
.group-count{margin-left:auto;font-size:10px;color:var(--muted);background:var(--side-2);border-radius:99px;padding:1px 7px}
.group-links{display:flex;flex-direction:column;gap:2px;padding-left:6px}
nav a{display:flex;align-items:center;gap:9px;color:var(--text);text-decoration:none;padding:9px 10px;border-radius:8px;font-size:13px}
nav a:hover{background:var(--side-2)}
nav a[aria-current=page]{background:var(--accent);color:#fff;font-weight:700}
nav a:focus-visible,.nav-group summary:focus-visible{outline:2px solid #5eead4}
.foot{font-size:10px;color:var(--muted);line-height:1.6;padding:10px 8px 0;border-top:1px solid var(--side-2)}
.foot a{display:inline;padding:0;color:#5eead4;font-size:10px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
iframe{flex:1;border:0;width:100%;min-height:0;background:#fff}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:760px){
 body{flex-direction:column}
 nav{flex:none;flex-direction:row;align-items:center;padding:8px;gap:4px;overflow-x:auto}
 .brand{padding:0 8px 0 4px}.brand div,.nav-search,.foot,.nav-group summary{display:none}
 .nav-list{display:flex;overflow:visible;padding:0}.nav-group,.group-links{display:flex;flex-direction:row;margin:0;padding:0}
 nav a{white-space:nowrap;padding:7px 10px}
}
</style>
</head>
<body>
<nav aria-label="문서 탐색">
 <div class="brand"><span class="logo">RA</span><div><b>AI 의료기기 인허가</b><small>한국 · 미국 · EU · 싱가포르 · 일본</small></div></div>
 <label class="nav-search"><span class="sr-only">문서 찾기</span><input id="nav-search" type="search" placeholder="문서 찾기" autocomplete="off"></label>
 <div class="nav-list" id="nav-list">
<!--__NAV__-->
 </div>
 <div class="foot">매달 1일 자동 갱신 · 법률 자문 아님<br><a href="https://github.com/srleeinkorea/aimd-regulatory-knowledge" target="_blank" rel="noopener">GitHub 저장소</a></div>
</nav>
<main><iframe id="frame" title="문서"></iframe></main>
<script>
const links=[...document.querySelectorAll('nav a[data-src]')], frame=document.getElementById('frame');
function show(){
  const a=links.find(l=>l.getAttribute('href')===location.hash)||links[0];
  links.forEach(l=>l.toggleAttribute('aria-current',l===a)); a.setAttribute('aria-current','page');
  if(frame.getAttribute('src')!==a.dataset.src) frame.src=a.dataset.src;
  document.title=a.textContent.replace(/^\S+\s/,'')+' · AI 의료기기 인허가 문서함';
}
addEventListener('hashchange',show); show();
document.getElementById('nav-search').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  links.forEach(l=>l.hidden=q&&!l.textContent.toLowerCase().includes(q));
  document.querySelectorAll('.nav-group').forEach(g=>g.hidden=![...g.querySelectorAll('a')].some(l=>!l.hidden));
});
</script>
</body>
</html>
