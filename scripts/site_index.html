<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 의료기기 인허가 문서함</title>
<style>
:root{--bg:#ffffff;--side:#0f172a;--side-2:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#0d9488}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg)}
body{display:flex;height:100dvh;overflow:hidden}
nav{flex:0 0 272px;background:var(--side);color:var(--text);display:flex;flex-direction:column;padding:20px 12px 10px;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#0f766e,#0891b2);display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}
.brand b{font-size:16px}.brand small{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
.nav-search{display:block;margin:0 4px 14px}
.nav-search input{width:100%;padding:10px 12px;border:1px solid #334155;border-radius:9px;background:var(--side-2);color:#f8fafc;font:inherit;font-size:12px}
.nav-search input::placeholder{color:var(--muted)}
.nav-list{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#475569 transparent;padding:0 2px 12px}
.nav-group{margin-bottom:8px}
.nav-group summary{display:flex;align-items:center;gap:8px;padding:11px 8px;color:#cbd5e1;cursor:pointer;font-size:12px;font-weight:700;list-style:none;border-radius:7px}
.nav-group summary::-webkit-details-marker{display:none}
.nav-group summary::before{content:'›';font-size:18px;line-height:12px;transition:transform .15s}
.nav-group[open] summary::before{transform:rotate(90deg)}
.group-count{margin-left:auto;font-size:10px;color:var(--muted);background:var(--side-2);border-radius:99px;padding:1px 7px}
.group-links{display:flex;flex-direction:column;gap:2px;padding-left:6px}
nav a{display:flex;align-items:center;gap:9px;color:var(--text);text-decoration:none;padding:9px 10px;border-radius:8px;font-size:13px}
nav a:hover{background:var(--side-2)}
nav a[aria-current=page]{background:var(--accent);color:#fff;font-weight:700}
nav a:focus-visible,.nav-group summary:focus-visible{outline:2px solid #5eead4}
.foot{font-size:10px;color:var(--muted);line-height:1.6;padding:10px 8px 0;border-top:1px solid var(--side-2)}
.foot a{display:inline;padding:0;color:#5eead4;font-size:10px}
main{flex:1;background:var(--bg);min-width:0;display:flex;flex-direction:column}
iframe{flex:1;border:0;width:100%;min-height:0;background:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a}}
:root[data-theme="dark"]{--bg:#0f172a}
#theme-btn{flex:0 0 auto}
body:not(.admin) .admin-only{display:none!important}
.admin-heading{font-size:10px;color:#fbbf24;letter-spacing:.06em;padding:14px 10px 4px;border-top:1px solid var(--side-2);margin-top:6px}
.tools{display:flex;gap:6px;padding:8px 4px}
.tools button{flex:1;font:inherit;font-size:12px;font-weight:700;border:1px solid #334155;background:var(--side-2);color:var(--text);border-radius:8px;padding:8px 10px;cursor:pointer}
.tools button:hover{border-color:var(--muted)}
.tools button[hidden]{display:none}
dialog{margin:auto;border:0;border-radius:14px;padding:22px;width:min(380px,calc(100% - 32px));box-shadow:0 20px 50px rgba(15,23,42,.3);color:#0f172a}
dialog::backdrop{background:rgba(15,23,42,.5)}
dialog h2{font-size:16px;margin-bottom:6px}
dialog p{font-size:12px;color:#475569;line-height:1.7;margin-bottom:12px}
dialog input{width:100%;font:14px Consolas,monospace;padding:10px;border:1px solid #cbd5e1;border-radius:8px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
dialog button{font:inherit;font-size:12px;font-weight:700;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}
dialog button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
dialog .err{color:#b91c1c;font-size:12px;margin-top:8px;min-height:1em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:760px){
 body{flex-direction:column}
 nav{flex:none;flex-direction:row;align-items:center;padding:8px;gap:4px;overflow-x:auto}
 .brand{padding:0 8px 0 4px}.brand div,.nav-search,.foot,.nav-group summary{display:none}
 .nav-list{display:flex;overflow:visible;padding:0}.nav-group,.group-links{display:flex;flex-direction:row;margin:0;padding:0}
 nav a{white-space:nowrap;padding:7px 10px}
}
</style>
</head>
<body>
<nav aria-label="문서 탐색">
 <div class="brand"><span class="logo">RA</span><div><b>AI 의료기기 인허가</b><small>한국 · 미국 · EU · 싱가포르 · 일본</small></div></div>
 <label class="nav-search"><span class="sr-only">문서 찾기</span><input id="nav-search" type="search" placeholder="문서 찾기" autocomplete="off"></label>
 <div class="nav-list" id="nav-list">
<!--__NAV__-->
 </div>
 <div class="tools"><button id="login-btn" type="button">🔒 관리자 로그인</button><button id="logout-btn" type="button" hidden>로그아웃</button><button id="theme-btn" type="button" aria-label="화면 모드 바꾸기">🌓 자동</button></div>
 <div class="foot">매달 1일 자동 갱신 · 법률 자문 아님<br><a href="https://github.com/srleeinkorea/aimd-regulatory-knowledge" target="_blank" rel="noopener">GitHub 저장소</a></div>
</nav>
<main><iframe id="frame" title="문서"></iframe></main>
<dialog id="login">
 <form id="login-form">
  <h2>관리자 로그인</h2>
  <p>에이전트 프롬프트와 설계 요소는 관리자만 볼 수 있습니다.</p>
  <label class="sr-only" for="pw">비밀번호</label>
  <input id="pw" type="password" inputmode="numeric" placeholder="비밀번호" autocomplete="current-password">
  <div class="err" id="err"></div>
  <div class="row"><button type="button" id="cancel">취소</button><button class="primary" type="submit">로그인</button></div>
 </form>
</dialog>
<script>
const links=[...document.querySelectorAll('nav a[data-src]')], frame=document.getElementById('frame');
// 정적 사이트용 간이 잠금(화면 숨김). 비밀번호 원문 대신 SHA-256 값만 둔다.
const PW_HASH='03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4';
const KEY='aimd-admin';
function isAdmin(){try{return sessionStorage.getItem(KEY)==='1'}catch(e){return document.body.classList.contains('admin')}}
function setAdmin(on){
  try{on?sessionStorage.setItem(KEY,'1'):sessionStorage.removeItem(KEY)}catch(e){}
  document.body.classList.toggle('admin',on);
  document.getElementById('login-btn').hidden=on; document.getElementById('logout-btn').hidden=!on;
}
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const dlg=document.getElementById('login');
document.getElementById('login-btn').onclick=()=>{document.getElementById('err').textContent='';document.getElementById('pw').value='';dlg.showModal()};
document.getElementById('cancel').onclick=()=>dlg.close();
document.getElementById('logout-btn').onclick=()=>{setAdmin(false);show()};
document.getElementById('login-form').addEventListener('submit',async e=>{
  e.preventDefault();
  if(await sha256(document.getElementById('pw').value)===PW_HASH){setAdmin(true);dlg.close();show()}
  else document.getElementById('err').textContent='비밀번호가 맞지 않습니다. 다시 입력해 주세요.';
});
setAdmin(isAdmin());
// 화면 모드: 자동(기기 설정) → 라이트 → 다크 순서로 바뀜
const MODES=[['','🌓 자동'],['light','☀️ 라이트'],['dark','🌙 다크']];
let theme='';try{theme=localStorage.getItem('aimd-theme')||''}catch(e){}
function applyTheme(){
  if(theme)document.documentElement.dataset.theme=theme;else delete document.documentElement.dataset.theme;
  document.getElementById('theme-btn').textContent=MODES.find(m=>m[0]===theme)[1];
  try{theme?localStorage.setItem('aimd-theme',theme):localStorage.removeItem('aimd-theme')}catch(e){}
  frame.contentWindow&&frame.contentWindow.postMessage({theme},'*');
}
document.getElementById('theme-btn').onclick=()=>{theme=MODES[(MODES.findIndex(m=>m[0]===theme)+1)%3][0];applyTheme()};
frame.addEventListener('load',()=>frame.contentWindow.postMessage({theme},'*'));
applyTheme();
function show(){
  const visible=links.filter(l=>document.body.classList.contains('admin')||!l.classList.contains('admin-only'));
  let a=visible.find(l=>l.getAttribute('href')===location.hash);
  if(!a&&links.some(l=>l.getAttribute('href')===location.hash)){a=visible[0];document.getElementById('login-btn').click()}
  a=a||visible[0];
  links.forEach(l=>l.toggleAttribute('aria-current',l===a)); a.setAttribute('aria-current','page');
  if(frame.getAttribute('src')!==a.dataset.src) frame.src=a.dataset.src;
  document.title=a.textContent.replace(/^\S+\s/,'')+' · AI 의료기기 인허가 문서함';
}
addEventListener('hashchange',show); show();
document.getElementById('nav-search').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  links.forEach(l=>l.hidden=q&&!l.textContent.toLowerCase().includes(q));
  document.querySelectorAll('.nav-group').forEach(g=>g.hidden=![...g.querySelectorAll('a')].some(l=>!l.hidden));
});
</script>
</body>
</html>
