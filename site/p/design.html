<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>에이전트 설계 요소</title>
<script>try{const t=localStorage.getItem("aimd-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}
addEventListener("message",e=>{if(e.data&&e.data.theme!==undefined){if(e.data.theme)document.documentElement.dataset.theme=e.data.theme;else delete document.documentElement.dataset.theme}})</script>
<style>
:root{--bg:#ffffff;--fg:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#0f766e;--accent-soft:#ccfbf1;--warn:#92400e;--warn-soft:#fef3c7;--code:#f1f5f9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--fg:#e2e8f0;--muted:#94a3b8;--line:#1e293b;--accent:#5eead4;--accent-soft:#134e4a;--warn:#fcd34d;--warn-soft:#422006;--code:#1e293b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--fg:#e2e8f0;--muted:#94a3b8;--line:#1e293b;--accent:#5eead4;--accent-soft:#134e4a;--warn:#fcd34d;--warn-soft:#422006;--code:#1e293b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:15px;line-height:1.7}
article{max-width:1000px;margin:0 auto;padding:28px max(16px,4vw) 60px}
h1{font-size:24px;margin:0 0 6px}
h2{font-size:18px;margin:32px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
h3{font-size:15px;margin:22px 0 6px}
p,li{max-width:76ch}
a{color:var(--accent);word-break:break-all}
code,pre{font-family:Consolas,ui-monospace,monospace;font-size:13px;background:var(--code);border-radius:6px}
code{padding:1px 5px}
pre{padding:14px;overflow-x:auto;white-space:pre-wrap}
pre code{padding:0;background:none}
.tbl{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;font-size:13.5px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{color:var(--muted);font-size:12px;white-space:nowrap;background:var(--code)}
td{font-variant-numeric:tabular-nums}
.ok,.chk{display:inline-block;font-size:11.5px;font-weight:700;padding:0 6px;border-radius:4px;white-space:nowrap}
.ok{color:var(--accent);background:var(--accent-soft)}.chk{color:var(--warn);background:var(--warn-soft)}
.asof{display:inline-block;font-size:12px;color:var(--muted);font-family:Consolas,monospace;margin-bottom:6px}
</style>
</head>
<body>
<article id="doc"></article>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const MD="# 인허가 에이전트 설계에 필요한 것\n\n| # | 요소 | 정할 것 | 지금 상태 |\n|---|---|---|---|\n| 1 | 역할·범위 | 관할(5개), 제품군(SaMD·SiMD·IVD 포함 여부), 하지 않을 일(법률 자문·제출 대행) | 정의됨 |\n| 2 | 사용자 | RA 담당자용(전문 용어) vs 기획·경영진용(쉬운 말) | 둘 다 — 질문에 맞춰 |\n| 3 | 지식 베이스 | 관할별 문서, 기준일, 1차/해설 구분 | `knowledge/` 초판 |\n| 4 | 출처 신뢰 규칙 | 1차 출처만 \"확정\", 해설은 \"확인 필요\" | `CLAUDE.md` |\n| 5 | 최신성 유지 | 갱신 주기(예: 월 1회), 감시 대상 사이트 | 주기 미정 — 예약 작업으로 설정 가능 |\n| 6 | 입력 양식 | 제품 정보 체크리스트(사용 목적, 출력, 학습 방식 등) | 에이전트 3단계 |\n| 7 | 출력 양식 | 관할별 7항목(해당성·등급·경로·근거·변경관리·시판후·기간) | 정의됨 |\n| 8 | 도구 | 웹 검색·페치, 파일 읽기·쓰기 | 정의됨. 사내 문서(DHF·SharePoint) 연동은 미정 |\n| 9 | 검증 | 실제 허가 사례로 답 맞춰보기(FDA AI 기기 목록, 식약처 허가 목록) | 미착수 — 평가셋 10~20문항 권장 |\n| 10 | 책임 한계 | 면책 문구, 사전상담 권고 기준 | 정의됨 |\n| 11 | 보안 | 미공개 제품 정보를 외부 검색어에 넣지 않기 | 추가 권장 |\n\n## 다음에 하면 좋은 것\n- 평가셋: \"흉부 X선 결절 검출 SW의 5개국 등급·경로\" 같은 정답 있는 문항.\n- 월 1회 자동 갱신 예약 작업: 각 기관 가이드라인 목록을 확인해 `knowledge/` 갱신.\n- 제출 문서 템플릿: 기술문서 목차(한국)·eSTAR 항목(미국)·Annex II(EU) 대응표.\n";
let h=marked.parse(MD);
h=h.replace(/\[확정\]/g,'<span class="ok">확정</span>').replace(/\[(확인 필요|미확인)([^\]]*)\]/g,'<span class="chk">$1$2</span>')
   .replace(/<p>기준일: ([\d-]+)<\/p>/,'<span class="asof">기준일 $1</span>')
   .replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>')
   .replace(/<a href="http/g,'<a target="_blank" rel="noopener" href="http');
document.getElementById('doc').innerHTML=h;
</script>
</body>
</html>
