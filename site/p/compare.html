<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>관할 비교표</title>
<style>
:root{--bg:#ffffff;--fg:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#0f766e;--accent-soft:#ccfbf1;--warn:#92400e;--warn-soft:#fef3c7;--code:#f1f5f9}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--fg:#e2e8f0;--muted:#94a3b8;--line:#1e293b;--accent:#5eead4;--accent-soft:#134e4a;--warn:#fcd34d;--warn-soft:#422006;--code:#1e293b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:15px;line-height:1.7}
article{max-width:1000px;margin:0 auto;padding:28px max(16px,4vw) 60px}
h1{font-size:24px;margin:0 0 6px}
h2{font-size:18px;margin:32px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
h3{font-size:15px;margin:22px 0 6px}
p,li{max-width:76ch}
a{color:var(--accent);word-break:break-all}
code,pre{font-family:Consolas,ui-monospace,monospace;font-size:13px;background:var(--code);border-radius:6px}
code{padding:1px 5px}
pre{padding:14px;overflow-x:auto;white-space:pre-wrap}
pre code{padding:0;background:none}
.tbl{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;font-size:13.5px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{color:var(--muted);font-size:12px;white-space:nowrap;background:var(--code)}
td{font-variant-numeric:tabular-nums}
.ok,.chk{display:inline-block;font-size:11.5px;font-weight:700;padding:0 6px;border-radius:4px;white-space:nowrap}
.ok{color:var(--accent);background:var(--accent-soft)}.chk{color:var(--warn);background:var(--warn-soft)}
.asof{display:inline-block;font-size:12px;color:var(--muted);font-family:Consolas,monospace;margin-bottom:6px}
</style>
</head>
<body>
<article id="doc"></article>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const MD="# 관할 비교표\n\n기준일: 2026-10-22\n\n| 항목 | 한국 | 미국 | EU | 싱가포르 | 일본 |\n|---|---|---|---|---|---|\n| 기관 | MFDS | FDA CDRH | 인증기관(NB) + 각국 당국 | HSA | MHLW / PMDA |\n| 등급 | 1~4 | I~III | I, IIa, IIb, III (Rule 11) | A~D | I~IV |\n| AI SW 흔한 등급 | 2~3 | II | IIa~IIb | B~C | II~III |\n| 주 경로 | 인증 / 허가 | 510(k) / De Novo | NB 적합성평가 → CE | Full / Abridged / Expedited | 認証 / 承認 |\n| 변경관리 사전승인 | 변경관리 계획서 (2026-06 가이드) | PCCP (2024-12 최종) | 공식 제도 없음, AI Act 사전 정의 변경 | 변경 통보 가이드 | IDATEN |\n| AI 별도 법 | 디지털의료제품법 | 없음(가이드) | AI Act (의료기기 2028-08-02 예정) | 없음(가이드) | 없음(가이드) |\n| 현지 대리인 | 수입업 허가 | US Agent | EU AR, PRRC | Registrant | MAH / 選任 |\n| 참조국 승인 활용 | 제한적 | 없음 | 없음 | 큼 (Abridged) | 제한적 |\n| 수가·보험 | 별도 (NECA 등) | 별도 (CMS) | 국가별 | 별도 | 별도 (中医協) |\n\n## 진출 순서 예시 (한국 스타트업, 영상 AI 진단 보조)\n1. 한국 허가 — 국내 데이터·임상 근거 확보\n2. 미국 510(k) (Pre-Sub 먼저) — 글로벌 신뢰도\n3. 싱가포르 Abridged — 미국 승인 활용해 단축\n4. EU CE — NB 일정이 길어 1~2번과 병행 착수\n5. 일본 — 현지 MAH 확보, 일본 데이터 보강\n";
let h=marked.parse(MD);
h=h.replace(/\[확정\]/g,'<span class="ok">확정</span>').replace(/\[(확인 필요|미확인)([^\]]*)\]/g,'<span class="chk">$1$2</span>')
   .replace(/<p>기준일: ([\d-]+)<\/p>/,'<span class="asof">기준일 $1</span>')
   .replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>')
   .replace(/<a href="http/g,'<a target="_blank" rel="noopener" href="http');
document.getElementById('doc').innerHTML=h;
</script>
</body>
</html>
