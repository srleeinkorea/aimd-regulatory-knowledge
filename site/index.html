:root{
  --bg:#f6f8f8; --panel:#ffffff; --fg:#17201f; --muted:#5b6866; --line:#d9e1df;
  --accent:#0f6b63; --accent-soft:#e2f0ee; --warn:#8a5a00; --warn-soft:#fbefd6;

  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101615; --panel:#161e1d; --fg:#e4ecea; --muted:#9aa8a5; --line:#2a3634;
  --accent:#5cc2b6; --accent-soft:#1c3330; --warn:#f0c46a; --warn-soft:#3a2f17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101615; --panel:#161e1d; --fg:#e4ecea; --muted:#9aa8a5; --line:#2a3634;
  --accent:#5cc2b6; --accent-soft:#1c3330; --warn:#f0c46a; --warn-soft:#3a2f17; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.65}
.wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;max-width:1180px;margin:0 auto;
  padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
header h1{font-size:22px;margin:0;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:13px}
nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);align-self:start}
nav button{all:unset;cursor:pointer;padding:8px 12px;border-radius:6px;color:var(--muted);font-size:14px}
nav button:hover{color:var(--fg);background:var(--accent-soft)}
nav button[aria-current="true"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
nav button:focus-visible{outline:2px solid var(--accent)}
article{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:24px clamp(16px,3vw,36px);min-width:0}
article h1{font-size:21px;margin:0 0 4px;text-wrap:balance}
article h2{font-size:17px;margin:28px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
article h3{font-size:15px;margin:20px 0 6px}
article p,article li{max-width:72ch}
article a{color:var(--accent);word-break:break-all}
article code{font-family:var(--font-mono);font-size:13px;background:var(--accent-soft);padding:1px 5px;border-radius:4px}
.tbl{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;font-size:13.5px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.03em;white-space:nowrap}
td{font-variant-numeric:tabular-nums}
.tag-ok,.tag-chk{display:inline-block;font-size:11.5px;font-weight:600;padding:0 6px;border-radius:4px;white-space:nowrap}
.tag-ok{color:var(--accent);background:var(--accent-soft)}
.tag-chk{color:var(--warn);background:var(--warn-soft)}
.asof{display:inline-block;font-size:12px;color:var(--muted);font-family:var(--font-mono);margin-bottom:8px}
@media (max-width:760px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  nav{flex-direction:row;overflow-x:auto;position:static;gap:4px;padding-bottom:4px}
  nav button{white-space:nowrap;padding:6px 10px}
}

<script>
const DOCS=[{"id": "k00", "label": "공통·국제조화", "md": "# 공통 기반 — 국제 조화\n\n기준일: 2026-10-22\n\n## 개념\n| 용어 | 뜻 | 예시 |\n|---|---|---|\n| SaMD | 하드웨어 없이 소프트웨어만으로 의료 목적 수행 | 흉부 X선에서 결절 위치를 표시하는 앱 |\n| SiMD | 의료기기 하드웨어 안에 들어간 소프트웨어 | 인슐린 펌프 제어 펌웨어 |\n| AI-MD / AI-SaMD | 머신러닝 등 AI를 쓰는 의료기기 SW | 심전도로 부정맥 분류 |\n| 잠금형(locked) vs 적응형(adaptive) | 출시 후 모델이 바뀌는지 여부 | 적응형은 변경관리계획 필요 |\n| 변경관리계획 (PCCP) | 미리 승인받은 범위 안의 모델 변경은 재허가 없이 반영 | 재학습 데이터 추가, 임계값 조정 |\n\n## 국제 문서 (IMDRF)\n- SaMD 위험 분류 프레임워크(정보의 중요도 × 환자 상태 심각도) — 한국·싱가포르·일본 분류의 바탕.\n- SaMD 임상 평가(N41): 타당한 임상 연관성 → 분석적 검증 → 임상적 검증 3단계.\n- GMLP(Good Machine Learning Practice) 10원칙 — FDA·Health Canada·MHRA 공동, 이후 IMDRF 최종 문서화. [확인 필요: IMDRF 최종판 번호]\n- MDSAP — 미국·캐나다·브라질·호주·일본 공동 품질 심사. 싱가포르·한국은 참관/연계 수준.\n\n## 공통 표준 (나라 대부분 인정)\n| 표준 | 다루는 것 |\n|---|---|\n| ISO 13485 | 품질경영시스템 |\n| ISO 14971 | 위험관리 |\n| IEC 62304 | SW 수명주기 |\n| IEC 62366-1 | 사용적합성 |\n| IEC 81001-5-1 | 헬스 SW 사이버보안 수명주기 |\n| ISO/IEC 42001, ISO/IEC 23894 | AI 경영시스템·AI 위험관리 (EU AI Act 대응에 유용) |\n| AAMI TIR34971 / BS/AAMI 34971 | ML 의료기기에 14971 적용 가이드 |\n\n## 재사용 전략 요점\n- 품질문서·위험관리·SW 문서는 한 번 만들어 5개국 공용으로.\n- 임상 성능 데이터는 다기관·다인종 구성이면 재사용성이 높음 (일본·싱가포르는 자국 인구 적합성 질문이 잦음).\n"}, {"id": "k10", "label": "한국 MFDS", "md": "# 한국 — 식품의약품안전처 (MFDS)\n\n기준일: 2026-10-22\n\n## 법 체계\n- 「의료기기법」 + 「디지털의료제품법」(2024-01 제정). 디지털의료기기(SW 포함)는 디지털의료제품법 체계로 관리. [확인 필요: 시행일 — 2025-01-24로 보는 자료와 2026-06-10 기준 안내가 혼재. 관보 확인]\n- 기존 인증·신고 디지털의료기기의 종전 기재사항 사용은 2027-01-23까지 허용 (2026-06-10 안내). [확인 필요]\n- 「체외진단의료기기법」 별도.\n\n## 등급과 경로\n| 등급 | 경로 | 비고 |\n|---|---|---|\n| 1등급 | 신고 | |\n| 2등급 | 인증 (한국의료기기안전정보원 위탁) / 신제품은 허가 | |\n| 3·4등급 | 허가 (식약처, 기술문서 + 임상자료) | AI 진단 보조 SW 다수가 2~3등급 |\n\n- 의료기기 해당 여부: 「의료기기와 개인용 건강관리(웰니스)제품 판단기준」 가이드라인으로 판단.\n- 혁신의료기기 지정 시 단계별 심사·우선 심사.\n- 건강보험 등재는 별도: 신의료기술평가(NECA)·혁신의료기술 / 디지털 치료기기 별도 수가 트랙. 허가 ≠ 수가.\n\n## 2025~2026 주요 가이드라인 (출처: 언론 보도, 원문 확인 필요)\n| 날짜 | 내용 |\n|---|---|\n| 2025-05 | 디지털의료기기 가이드라인 1종 제정, 5종 개정 |\n| 2026-06-26 | 디지털의료기기 **변경관리 계획서** 허가·심사 가이드라인 제정 (한국판 PCCP) |\n| 2026-07-27 | 고시 개정 — SW형 기기 임상시험자료 제출·면제 기준 명확화 |\n| 2026-09-16 | 디지털의료기기 **구성요소 성능평가** 가이드라인 — 사전 평가된 AI 알고리즘·센서 활용 신속 신청 |\n| 2026 예정 | 생성형 AI 의료기기 판단 기준·성능검증 가이드라인 [미확인] |\n\n## 기존 핵심 가이드라인\n- 인공지능 기술이 적용된 의료기기의 허가·심사 가이드라인\n- 빅데이터 및 인공지능 기술이 적용된 의료기기의 임상 유효성 평가 가이드라인\n- 의료기기 사이버보안 허가·심사 가이드라인\n- 디지털치료기기 허가·심사 가이드라인\n\n## 허가 현황\n- 품목 목록: [11_한국_AI허가목록.md](11_한국_AI허가목록.md) — 의료기기안심책방에서 분류명으로 모은 후보 447건(검출·진단보조 150, 영상 분석 287, 생체신호 분석 10). AI 여부는 상세 기재사항으로 확인.\n- 2025년부터 디지털의료기기는 새 분류명(예: '뇌 영상 검출·진단보조 소프트웨어', E로 시작하는 분류번호)으로 등록되고, 기존 품목은 상태 '전환'으로 표시.\n- 수집된 가장 최근 허가일은 2025-07. 2025-08 이후 허가는 다른 분류명이나 디지털의료기기 별도 DB에 있을 수 있음. [확인 필요]\n\n## 실무 포인트\n- 후향적 임상 성능시험(기존 영상·데이터 재분석)으로 갈음 가능한 경우가 많음 → 임상시험계획(IRB) 설계가 일정 좌우.\n- 식약처 사전상담(제품화 지원) 적극 활용.\n"}, {"id": "k11", "label": "한국 AI 허가 목록", "md": "# 한국 — AI 의료기기 후보 허가 목록 (식약처)\n\n기준일: 2026-10-22\n\n출처: 의료기기안심책방 품목검색 (https://emedi.mfds.go.kr/search/data/MNU20237). `scripts/fetch_mfds_ai.py` 로 다시 만든다.\n\n**분류명 기준 후보 목록이다. AI 여부는 각 품목 상세 기재사항(작용원리·학습데이터)으로 확인해야 한다.**\n\n## 읽는 법\n- A 묶음(검출·진단보조): 병변을 찾거나 진단을 돕는 SW. 대부분 AI.\n- B 묶음(영상 분석): 크기·부피 측정, 3D 재구성 등. AI 제품과 일반 영상처리 SW가 섞임.\n- C 묶음(생체신호 분석): 심전도·활력징후로 위험 예측 등.\n- 상태 '전환' = 디지털의료제품법 시행으로 디지털의료기기로 전환된 품목. '정상'과 함께 현재 유효.\n- 품목명이 같은 종류라도 띄어쓰기가 다르게 등록됨(예: 뇌영상검출·진단보조소프트웨어 / 뇌 영상 검출·진단보조 소프트웨어).\n\n## 검색어별 건수\n\n| 검색어 | 건수 |\n|---|---|\n| 진단보조 | 139 |\n| 검출보조 | 11 |\n| 의료영상분석장치소프트웨어 | 72 |\n| 영상 분석 소프트웨어 | 287 |\n| 생체신호 분석 소프트웨어 | 10 |\n| 중복 제거 합계 (허가번호 기준) | 447 |\n\n## A. 검출·진단보조 (AI 가능성 높음) — 150건 (유효 121건)\n\n| 업체 | 품목명 | 제품명·모델명 | 허가번호 | 등급 | 상태 | 허가일 |\n|---|---|---|---|---|---|---|\n| 크리스타비전 주식회사 | 안과 영상 검출·진단보조 소프트웨어 | Reticare / Reticare | 제허25-436호 | 3 | 전환 | 2025-07-03 |\n| 모니터코퍼레이션 주식회사 | 유방암 영상 검출·진단보조 소프트웨어 | LuCAS ABS DX, MONCAD ABS DX / MLA-02 | 제허25-374호 | 3 | 전환 | 2025-06-05 |\n| (주)휴런 | 뇌 영상 검출·진단보조 소프트웨어 | Heuron PD / PD-PNX01 | 제허25-368호 | 3 | 전환 | 2025-06-02 |\n| 뉴로핏(주) | 뇌 영상 검출·진단보조 소프트웨어 | Neurophet AQUA AD Plus / Neurophet AQUA AD Plus |  / IK-01 | 제인23-5086호 | 2 | 취하 (2025-09-26) | 2023-09-15 |\n| 주식회사 제논 | 생체신호분석소프트웨어 | BUD on Mobile / BDM | 제인22-4826호 | 2 | 정상 | 2022-10-27 |\n| (주)에이아이트릭스 | 생체신호분석소프트웨어 | AITRICS-VC / AITRICS-VC | 제허22-723호 | 2 | 전환 | 2022-10-26 |\n| 주식회사 뷰노 | 생체신호분석소프트웨어 | VUNO Med-DeepCARS, VUNO Med-EarlySign / VN-C-01 외 1 건 | 제허21-709호 | 2 | 전환 | 2021-08-23 |\n"}, {"id": "k20", "label": "미국 FDA", "md": "# 미국 — FDA (CDRH, Digital Health Center of Excellence)\n\n기준일: 2026-10-22\n\n## 경로\n| 경로 | 대상 | 기간(심사 목표) |\n|---|---|---|\n| 510(k) | 유사 기기(predicate) 있음, Class II | 90 FDA일 |\n| De Novo | 신규·저중위험, predicate 없음 | 150 FDA일 |\n| PMA | Class III | 180일+ 자문위원회 |\n| Breakthrough Device | 우선 상호작용 | 지정 후 위 경로 중 하나 |\n\n- Pre-Submission(Q-Sub): 제출 전 FDA 의견 받기. AI 기기는 사실상 필수.\n- 의료기기 아님: 21st Century Cures Act 의 CDS 예외(의료진이 근거를 독립적으로 검토 가능), 일반 웰니스. 근거: *Clinical Decision Support Software* 가이드(2022), *General Wellness*. [확인 필요: 2026 개정 여부]\n- AI 기기 허가 목록: FDA \"AI-Enabled Medical Devices\" 목록(상시 갱신).\n\n## AI 핵심 문서\n| 문서 | 상태 |\n|---|---|\n| PCCP for AI-Enabled Device Software Functions | **최종** 2024-12-04 (범위: ML → 모든 AI로 확대) [확정] |\n| AI-Enabled Device Software Functions: Lifecycle Management and Marketing Submission Recommendations | 초안 2025-01 [확인 필요: 최종화 여부] |\n| Content of Premarket Submissions for Device Software Functions | 최종 2023-06 (Basic/Enhanced 문서 수준) |\n| Cybersecurity in Medical Devices (FD&C 524B) | 최종 2023, 2025 개정 — SBOM·위협모델 필수 |\n| GMLP 10원칙 / PCCP 원칙 / Transparency 원칙 | FDA·HC·MHRA 공동 |\n\n## 품질 시스템\n- QMSR: 21 CFR 820 이 ISO 13485:2016 을 인용하는 방식으로 2026-02-02 시행. [확정 — 2024-02 최종 규칙]\n\n## 실무 포인트\n- 510(k)는 predicate 선택이 승부. 동일 의도 용도·기술적 차이가 새 안전성 문제를 만들지 않음을 보여야 함.\n- 성능 시험: 독립된 테스트셋, 하위집단(성별·인종·기기 제조사) 분석, 독자연구(MRMC) 여부를 Pre-Sub에서 합의.\n- 라벨링에 모델 설명·학습 데이터 특성·한계 기재 (투명성).\n"}, {"id": "k30", "label": "EU MDR·AI Act", "md": "# EU — MDR/IVDR + AI Act (CE 마킹)\n\n기준일: 2026-10-22\n\n## MDR (Regulation (EU) 2017/745)\n- SW 등급: **Rule 11** — 진단·치료 결정에 쓰이는 정보 제공 SW는 최소 IIa, 사망·비가역적 악화 가능성이면 III, 중대 악화면 IIb. 대부분 AI SW가 IIa 이상 → 인증기관(Notified Body) 심사 필수.\n- 해당 여부·분류: MDCG 2019-11 (SW 자격·분류, 2025 개정판 있음 [확인 필요]).\n- 임상평가: MDCG 2020-1 (SW 임상평가 — 임상 연관성/기술 성능/임상 성능).\n- 사이버보안: MDCG 2019-16.\n- 경과 규정: 기존 MDD 인증 기기는 위험도에 따라 2027-12-31 / 2028-12-31 까지 (Reg. 2023/607). [확정]\n- 필요한 것: 기술문서(Annex II·III), QMS, PRRC 지정, EU 대리인(역외 제조사), EUDAMED·UDI, PMS/PSUR.\n\n## AI Act (Regulation (EU) 2024/1689)\n- MDR/IVDR 상 인증기관 심사가 필요한 AI 의료기기 = **고위험 AI** (Art. 6(1), Annex I).\n- 원래 적용일 2027-08-02. **Digital Omnibus on AI** 로 연기: Annex I(의료기기 포함) **2028-08-02**, Annex III 2027-12-02. 2026-05-07 정치적 합의 보도. [확인 필요: 관보 게재]\n- 의료기기는 AI Act 고위험에 그대로 남음 (별도 섹터 경로로 빠지지 않음).\n- 요구: 위험관리, 데이터 거버넌스(편향), 기술문서, 로깅, 투명성, 인간 감독, 정확도·견고성·사이버보안, QMS → MDR 기술문서와 **통합 문서** 가능, 심사는 MDR 인증기관이 함께 (해당 인증기관이 AI Act 지정을 받아야 함).\n- MDCG 2025-6: MDR/IVDR 와 AI Act 상호작용 FAQ. [확인 필요: 번호]\n- 병목: 조화표준 미완(2026-12 이후 예상), 인증기관 수용력.\n\n## 실무 포인트\n- 인증기관 확보에 수개월~1년. 일찍 계약.\n- 지속학습 모델은 MDR 상 \"중대한 변경\" 판단 필요 → 변경 범위를 기술문서에 미리 정의 (EU에는 FDA식 PCCP 공식 제도 없음, AI Act 는 사전 정의된 변경 개념 있음).\n"}, {"id": "k40", "label": "싱가포르 HSA", "md": "# 싱가포르 — Health Sciences Authority (HSA)\n\n기준일: 2026-10-22\n\n## 체계\n- Health Products Act + Health Products (Medical Devices) Regulations 2010.\n- 등급 A(저)~D(고), GHTF/IMDRF 규칙 기반. SaMD 분류 가이드 개정 2025-07.\n- 경로: Class A 는 등록 면제(제조·수입 허가만), B·C·D 는 SMDR 등록.\n  - **Full** / **Abridged** (참조국 승인 1개 보유) / **Expedited** (참조국 2개 등 조건) / **Immediate** (일부 B).\n  - 참조 기관: 미국 FDA, EU 인증기관, 호주 TGA, 캐나다 HC, 일본 MHLW (+ 일부 기준). [확인 필요: 최신 목록]\n- 현지 등록자(Registrant) 필수 — 싱가포르 법인 또는 대리인.\n\n## AI·SaMD 문서\n- *Regulatory Guidelines for Software Medical Devices – A Life Cycle Approach* (AI-MD 요구 포함: 데이터셋, 학습·검증, 지속학습 변경관리).\n- 2025-07 개정: 확립된 임상지침만 따르고 AI·적응 로직이 없는 CDSS 는 의료기기 아님.\n- 2026-02-13: 공공의료기관 자체개발 AI-SaMD 의 허가 면제(샌드박스) 의견수렴 결과 발표.\n- 2026-03: 보건부 헬스케어 AI 가이드라인(AIHGle) 개정. HSA 는 WHO 최고 등급(ML4) 획득. [확인 필요: ML4 날짜]\n- 변경 통보: Change Notification 가이드 (Review/Notification/Administrative).\n\n## 실무 포인트\n- 미국·EU 승인을 먼저 받으면 Abridged/Expedited 로 단기간 등록 → 보통 \"3순위 이후\" 진출국.\n"}, {"id": "k50", "label": "일본 PMDA", "md": "# 일본 — 후생노동성(MHLW) / PMDA\n\n기준일: 2026-10-22\n\n## 체계\n- 薬機法(PMD Act). SW 단독도 「プログラム医療機器」로 규제 (2014~).\n- 등급 I~IV (일반·관리·고도관리).\n| 등급 | 경로 |\n|---|---|\n| I | 届出(신고) |\n| II (인증기준 있음) | 第三者認証 (등록인증기관) |\n| II 일부·III·IV | 承認 (PMDA 심사 → MHLW 승인) |\n- 해외 제조사: 外国製造業者登録 + 일본 내 製造販売業者(MAH) 또는 選任製造販売業者 필요. QMS 省令(ISO 13485 기반), MDSAP 보고서 활용 가능.\n\n## SaMD 정책\n- **DASH for SaMD** (2020) → **DASH for SaMD 2** (2023): 상담 창구 일원화, 2단계 승인, 우선 심사. [확인 필요: 2026 후속]\n- 2단계 승인: 탐색적 근거로 1단계 승인 → 시판 후 실사용 데이터로 2단계 효능 추가.\n- **IDATEN** (改善計画, 2020 법 개정): 승인 시 변경계획을 미리 확인받아 이후 변경을 신고로 처리 — 일본판 PCCP.\n- 프로그램 의료기기 해당성 가이드라인(該当性ガイドライン) — 웰니스와 구분.\n- PMDA SaMD 전문 심사부문 + 사전상담(レギュラトリーサイエンス相談) 활용.\n- 보험: 승인 후 中医協 보험 적용 별도 (가산·특정보험의료재료 등).\n\n## 실무 포인트\n- 일본인 데이터 적합성 질문이 잦음 → 일본 데이터 일부 포함 또는 인구학적 동등성 논리 준비.\n- 문서는 일본어 제출 → 현지 MAH·번역 비용 반영.\n"}, {"id": "k90", "label": "관할 비교표", "md": "# 관할 비교표\n\n기준일: 2026-10-22\n\n| 항목 | 한국 | 미국 | EU | 싱가포르 | 일본 |\n|---|---|---|---|---|---|\n| 기관 | MFDS | FDA CDRH | 인증기관(NB) + 각국 당국 | HSA | MHLW / PMDA |\n| 등급 | 1~4 | I~III | I, IIa, IIb, III (Rule 11) | A~D | I~IV |\n| AI SW 흔한 등급 | 2~3 | II | IIa~IIb | B~C | II~III |\n| 주 경로 | 인증 / 허가 | 510(k) / De Novo | NB 적합성평가 → CE | Full / Abridged / Expedited | 認証 / 承認 |\n| 변경관리 사전승인 | 변경관리 계획서 (2026-06 가이드) | PCCP (2024-12 최종) | 공식 제도 없음, AI Act 사전 정의 변경 | 변경 통보 가이드 | IDATEN |\n| AI 별도 법 | 디지털의료제품법 | 없음(가이드) | AI Act (의료기기 2028-08-02 예정) | 없음(가이드) | 없음(가이드) |\n| 현지 대리인 | 수입업 허가 | US Agent | EU AR, PRRC | Registrant | MAH / 選任 |\n| 참조국 승인 활용 | 제한적 | 없음 | 없음 | 큼 (Abridged) | 제한적 |\n| 수가·보험 | 별도 (NECA 등) | 별도 (CMS) | 국가별 | 별도 | 별도 (中医協) |\n\n## 진출 순서 예시 (한국 스타트업, 영상 AI 진단 보조)\n1. 한국 허가 — 국내 데이터·임상 근거 확보\n2. 미국 510(k) (Pre-Sub 먼저) — 글로벌 신뢰도\n3. 싱가포르 Abridged — 미국 승인 활용해 단축\n4. EU CE — NB 일정이 길어 1~2번과 병행 착수\n5. 일본 — 현지 MAH 확보, 일본 데이터 보강\n"}, {"id": "src", "label": "출처 목록", "md": "# 출처 목록\n\n| 확인일 | 관할 | 내용 | 출처 | 종류 |\n|---|---|---|---|---|\n| 2026-10-22 | 미국 | PCCP 최종 가이드 2024-12-04 | https://www.foley.com/insights/publications/2025/01/fda-final-guidance-ai-device-software-predetermined-change-control-plan/ | 해설 |\n| 2026-10-22 | 한국 | 2026 디지털의료기기 가이드라인 연속 정비 | https://www.dailypharm.com/user/news/340892 | 언론 |\n| 2026-10-22 | 한국 | 디지털의료제품법 관련 정책자료 | https://eiec.kdi.re.kr/policy/materialView.do?num=282506 | 정책자료 |\n| 2026-10-22 | 한국 | 생성형 AI 가이드라인 계획 | https://kormedi.com/1681469/ | 언론 |\n| 2026-10-22 | EU | Digital Omnibus 의회 수정안 2026-03-26 | https://medicaldevices.ipn.pt/en/eu-digital-omnibus-on-ai-european-parliament-amendments-adopted-on-26-march-2026/ | 해설 |\n| 2026-10-22 | EU | AI 의료기기 고위험 유지 확인 | https://www.taylorwessing.com/en/international-life-sciences-newsletter/life-sciences-legal-lens-vol-2/update-ai-enabled-medical-devices-and-ivds-confirmed-as-high-risk | 해설 |\n| 2026-10-22 | 싱가포르 | AI-SaMD 면제 의견수렴 결과 | https://www.bakermckenzie.com/en/insight/publications/2026/02/singapore-hsa-releases-ai-medical-software | 해설 |\n| 2026-10-22 | 싱가포르 | 2025 SaMD·CDSS 개정 | https://www.pureglobal.com/news/singapore-hsa-2025-samd-cdss-guidelines-update | 해설 |\n| 2026-10-22 | 일본 | IMDRF 일본 국가보고 2026-03 | https://www.imdrf.org/sites/default/files/2026-03/Japan.pdf | 1차 |\n| 2026-10-22 | 한국 | AI 후보 품목 447건 (분류명 검색) | https://emedi.mfds.go.kr/search/data/MNU20237 | 1차 |\n\n## 1차 출처 위치 (갱신 시 여기부터)\n- 한국: 식약처 법령·자료 > 안내서/지침, 의료기기안심책방(emedi.mfds.go.kr)\n- 미국: FDA Guidance Documents DB, AI-Enabled Medical Devices 목록\n- EU: EUR-Lex(관보), health.ec.europa.eu MDCG 문서\n- 싱가포르: hsa.gov.sg Medical Devices > Guidance documents\n- 일본: pmda.go.jp (English > Review Services > SaMD), mhlw.go.jp\n"}];
const nav=document.getElementById('nav'), doc=document.getElementById('doc');
function render(id){
  const d=DOCS.find(x=>x.id===id)||DOCS[0];
  let h=marked.parse(d.md);
  h=h.replace(/\[확정\]/g,'<span class="tag-ok">확정</span>').replace(/\[확인 필요([^\]]*)\]/g,'<span class="tag-chk">확인 필요$1</span>')
     .replace(/<p>기준일: ([\d-]+)<\/p>/,'<span class="asof">기준일 $1</span>')
     .replace(/<table>/g,'<div class="tbl"><table>').replace(/<\/table>/g,'</table></div>')
     .replace(/<a href="http/g,'<a target="_blank" rel="noopener" href="http');
  doc.innerHTML=h;
  [...nav.children].forEach(b=>b.setAttribute('aria-current',b.dataset.id===d.id));
}
DOCS.forEach(d=>{const b=document.createElement('button');b.textContent=d.label;b.dataset.id=d.id;
  b.onclick=()=>{render(d.id);history.replaceState(null,'','#'+d.id);window.scrollTo(0,0)};nav.appendChild(b)});
render(location.hash.slice(1));
</script>
